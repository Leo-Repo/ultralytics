# YOLO26 OBB Face Lite model with P3/8 - P5/32 outputs
# Candidate sizes: m (precision, ~0.86M), s (balanced, ~0.67M), n (compact, ~0.54M parameters)

# Parameters
nc: 1
end2end: True
reg_max: 1
activation: torch.nn.ReLU()
scale: m
imgsz: [192, 320] # height, width
rect: False
train_imgsz: 320
input_norm: minus128_div128
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.1000, 1024]
  s: [0.50, 0.1150, 1024]
  m: [0.50, 0.1325, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 1, C3k2, [1024, True]] # 10, convolutional replacement for C2PSA

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 16-P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 19-P4/16

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5]] # 22-P5/32

  - [[16, 19, 22], 1, OBB26, [nc, 1]]
